<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scratch, HTML & Computer Studies Quiz</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1f2540;--mu:#667;--pr:#5b4bdb;--ok:#1a9d5a;--no:#d6403f;--bd:#dde1ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14172a;--card:#1e2240;--tx:#eef;--mu:#9aa;--bd:#33385e}}
:root[data-theme="dark"]{--bg:#14172a;--card:#1e2240;--tx:#eef;--mu:#9aa;--bd:#33385e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Arial,sans-serif;line-height:1.5}
.w{max-width:680px;margin:0 auto;padding:20px 16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;margin-top:14px}
h1{margin:0 0 6px;font-size:1.6rem}p{color:var(--mu);margin:4px 0}
.cats{display:grid;gap:10px;margin:16px 0}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px;text-align:left}
button:hover:not(:disabled){border-color:var(--pr)}
.p{background:var(--pr);color:#fff;border:0;text-align:center;font-weight:600}
.cat{display:flex;justify-content:space-between;align-items:center}
.cat small{color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--pr);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem}
.q{font-size:1.15rem;font-weight:600;margin:12px 0}
.o{display:block;width:100%;margin:8px 0}
.o.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.o.no{background:var(--no);color:#fff;border-color:var(--no)}
.big{font-size:2.6rem;font-weight:700;color:var(--pr);text-align:center}
code{background:var(--bd);padding:1px 5px;border-radius:5px}
.r{display:flex;gap:10px;margin-top:12px}.r button{flex:1}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
// [question, [options], correctIndex]; sections: Scratch (1-34), HTML (35-67), Computer Studies (68-100)
const S=[
["Scratch is a ___ programming language.",["Text-based","Block-based visual","Machine code","Assembly"],1],
["Which organisation created Scratch?",["MIT Media Lab","Google","Apple","Microsoft"],0],
["The character you program in Scratch is called a:",["Sprite","Avatar","Icon","Actor box"],0],
["The area where sprites perform is the:",["Stage","Palette","Timeline","Canvas bar"],0],
["Where do you drag blocks to build a program?",["Scripts area","Costumes tab","Sounds tab","Stage"],0],
["Which block colour group holds 'move 10 steps'?",["Motion (blue)","Looks (purple)","Sound (pink)","Events (yellow)"],0],
["Which block group holds 'say Hello!'?",["Looks","Motion","Sensing","Operators"],0],
["'when green flag clicked' is in the ___ category.",["Events","Control","Sensing","Variables"],0],
["Which block repeats actions forever?",["forever","wait","if","stop all"],0],
["'repeat 10' is an example of a:",["Loop","Variable","Event","Costume"],0],
["Which block pauses a script for some seconds?",["wait","stop","hide","glide"],0],
["An 'if ... then' block makes a:",["Decision","Loop","Costume","Sound"],0],
["Which block group contains 'touching color?'",["Sensing","Motion","Looks","Events"],0],
["Changing how a sprite looks is done with:",["Costumes","Backdrops","Variables","Extensions"],0],
["The picture behind the sprites is the:",["Backdrop","Costume","Script","Block"],0],
["A variable in Scratch is used to:",["Store a value","Draw a sprite","Play music","Delete blocks"],0],
["'Score' in a game is usually a:",["Variable","Backdrop","Sound","Costume"],0],
["Which block adds 1 to a variable?",["change score by 1","set score to 0","show variable","hide variable"],0],
["Which block gives a random number?",["pick random 1 to 10","join","length of","round"],0],
["The Operators category includes:",["+ − × ÷ and comparisons","Costumes","Sound effects","Backdrops"],0],
["The x position of a sprite tells its:",["Left/right position","Up/down position","Size","Direction"],0],
["The y position of a sprite tells its:",["Up/down position","Left/right position","Colour","Speed"],0],
["Which block turns a sprite clockwise?",["turn ↻ 15 degrees","move 15 steps","glide 1 sec","go to x y"],0],
["'broadcast message' is used to:",["Send a signal between sprites","Delete a sprite","Change backdrop colour","Save a project"],0],
["Which key do you press to test the 'space' key script?",["Space bar","Enter only","Shift only","Esc"],0],
["The green flag button is used to:",["Run the project","Delete the project","Save online","Change language"],0],
["The red stop sign button:",["Stops the project","Starts it","Adds a sprite","Opens costumes"],0],
["Which tab lets you draw or edit a sprite's look?",["Costumes","Code","Sounds","Backpack"],0],
["Which tab is used to record or add audio?",["Sounds","Costumes","Code","Stage"],0],
["Fixing mistakes in a program is called:",["Debugging","Compiling","Printing","Formatting"],0],
["A set of steps to solve a problem is an:",["Algorithm","Icon","Browser","Costume"],0],
["Blocks stacked in order run:",["Top to bottom","Bottom to top","Randomly","All at once always"],0],
["Using a loop instead of copying blocks makes code:",["Shorter and neater","Longer","Broken","Silent"],0],
["Scratch projects can be shared on the:",["Scratch website community","Only by USB","Telephone","Printer"],0],
["HTML stands for:",["HyperText Markup Language","High Tech Modern Language","Home Tool Markup Language","HyperTransfer Machine Language"],0],
["HTML is used to:",["Structure web pages","Repair hardware","Manage databases only","Type documents offline"],0],
["An HTML element usually has an opening and a:",["Closing tag","Comment","Image","Table"],0],
["Tags are written inside:",["Angle brackets < >","Curly braces { }","Square brackets [ ]","Quotes only"],0],
["Which tag makes the largest heading?",["<h1>","<h6>","<head>","<title>"],0],
["Which tag creates a paragraph?",["<p>","<para>","<pg>","<text>"],0],
["Which tag inserts a line break?",["<br>","<lb>","<break>","<hr>"],0],
["Which tag makes text bold?",["<b>","<i>","<u>","<bd>"],0],
["Which tag makes text italic?",["<i>","<b>","<it>","<em2>"],0],
["Which tag creates a hyperlink?",["<a>","<link>","<href>","<url>"],0],
["The attribute that holds a link's address is:",["href","src","alt","title"],0],
["Which tag displays an image?",["<img>","<image>","<pic>","<src>"],0],
["The 'src' attribute of <img> gives:",["The image file path","The alt text","The width only","The border"],0],
["The 'alt' attribute provides:",["Alternative text for an image","A link","A colour","A font"],0],
["Which tag creates an unordered (bullet) list?",["<ul>","<ol>","<li>","<dl>"],0],
["Which tag creates a numbered list?",["<ol>","<ul>","<li>","<nl>"],0],
["Each item in a list uses the tag:",["<li>","<item>","<list>","<td>"],0],
["Which tag creates a table?",["<table>","<tab>","<grid>","<tr> only"],0],
["A table row is made with:",["<tr>","<td>","<th>","<row2>"],0],
["A table data cell is:",["<td>","<tr>","<tb>","<cell>"],0],
["A table header cell is:",["<th>","<td>","<head>","<hd>"],0],
["The whole page content visible in the browser is inside:",["<body>","<head>","<meta>","<title>"],0],
["The text on the browser tab comes from:",["<title>","<h1>","<body>","<p>"],0],
["Which declaration starts a modern HTML5 page?",["<!DOCTYPE html>","<html5>","<?html?>","<start>"],0],
["The root element of an HTML page is:",["<html>","<body>","<head>","<root>"],0],
["Which section holds page information like the title?",["<head>","<body>","<footer>","<p>"],0],
["HTML files are usually saved with the extension:",[".html",".exe",".mp3",".docx"],0],
["Which program opens and displays HTML pages?",["Web browser","Calculator","Spreadsheet","Media player only"],0],
["A comment in HTML is written as:",["<!-- comment -->","// comment","/* comment */","# comment"],0],
["Which tag groups content as a block-level container?",["<div>","<span>","<b>","<br>"],0],
["Which tag creates a form input field?",["<input>","<field>","<text>","<form2>"],0],
["Which tag makes a clickable button?",["<button>","<click>","<press>","<btn2>"],0],
["CSS is used with HTML to:",["Style the page","Store data","Send email","Compile code"],0],
["Hardware means:",["Physical parts of a computer","Programs","The internet","Data only"],0],
["Software means:",["Programs and instructions","Monitor and mouse","Cables","The case"],0],
["Which is an input device?",["Keyboard","Monitor","Speaker","Printer"],0],
["Which is an output device?",["Monitor","Mouse","Scanner","Microphone"],0],
["The 'brain' of the computer is the:",["CPU","Monitor","Mouse","Speaker"],0],
["CPU stands for:",["Central Processing Unit","Computer Power Unit","Central Program Utility","Control Printing Unit"],0],
["RAM is:",["Temporary working memory","Permanent storage","An input device","A printer"],0],
["Which is permanent storage?",["Hard disk","RAM","Cache only","Keyboard"],0],
["A byte is made of how many bits?",["8","4","2","16"],0],
["The smallest unit of data is a:",["Bit","Byte","Kilobyte","Megabyte"],0],
["Binary uses which digits?",["0 and 1","0 to 9","1 and 2","A and B"],0],
["Which is larger?",["Gigabyte","Megabyte","Kilobyte","Byte"],0],
["An operating system is:",["Software that manages the computer","A game","A website","A cable"],0],
["Which is an operating system?",["Windows","Chrome","Word","Paint"],0],
["Which is a web browser?",["Firefox","Linux","Excel","Photoshop"],0],
["Which is a word processing program?",["Microsoft Word","Excel","Paint","Scratch"],0],
["Which program is mainly used for spreadsheets?",["Excel","Word","Notepad","Paint"],0],
["WWW stands for:",["World Wide Web","World Web Wire","Wide World Window","Web World Work"],0],
["The Internet is:",["A global network of networks","One big computer","A single website","A program"],0],
["A unique address of a website is called a:",["URL","CPU","RAM","USB"],0],
["Email stands for:",["Electronic mail","Easy mail","Express mailbox","Entry mail"],0],
["Software designed to harm a computer is:",["Malware","Freeware","Firmware","Hardware"],0],
["A program that detects and removes viruses is:",["Antivirus","Browser","Compiler","Spreadsheet"],0],
["A strong password should:",["Mix letters, numbers, symbols","Be your name","Be 1234","Be shared with friends"],0],
["Copying someone's work and claiming it as yours is:",["Plagiarism","Research","Citation","Backup"],0],
["Making a copy of files in case of loss is a:",["Backup","Virus","Crash","Format"],0],
["A computer network in a small area like a school is a:",["LAN","WAN","MAN only","PAN"],0],
["Ctrl + C is the shortcut for:",["Copy","Cut","Paste","Close"],0],
["Ctrl + V is the shortcut for:",["Paste","Copy","Save","Undo"],0],
["Ctrl + Z usually:",["Undoes the last action","Saves","Prints","Closes"],0],
["Ctrl + S usually:",["Saves the file","Selects all","Searches web","Starts program"],0],
["A folder is used to:",["Organise files","Cool the CPU","Print pages","Connect to Wi-Fi"],0],
["Which is a programming language?",["Python","Windows","Chrome","Printer"],0],
];
const CATS=[["Scratch",0,34,"🐱"],["HTML Basics",34,67,"🌐"],["Computer Studies",67,100,"💻"],["All 100 Questions",0,100,"🏆"]];
const app=document.getElementById('app');
let qs=[],i=0,sc=0,done=false,name="";
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function home(){
 app.innerHTML=`<div class="c"><h1>🧠 Scratch, HTML &amp; Computer Studies Quiz</h1><p>100 questions. Pick a section, answer, and see your score.</p>
 <div class="cats">${CATS.map((c,n)=>`<button class="cat" onclick="start(${n})"><span>${c[3]} ${c[0]}</span><small>${c[2]-c[1]} questions</small></button>`).join("")}</div></div>`}
function start(n){const c=CATS[n];name=c[0];qs=shuffle(S.slice(c[1],c[2])).map(q=>{const o=q[1].map((t,k)=>[t,k===q[2]]);return [q[0],shuffle(o)]});i=0;sc=0;show()}
function show(){
 const q=qs[i];
 app.innerHTML=`<div class="c"><div class="top"><span>${name}</span><span>Question ${i+1} / ${qs.length} · Score ${sc}</span></div>
 <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
 <div class="q">${esc(q[0])}</div>
 ${q[1].map((o,k)=>`<button class="o" onclick="pick(${k})">${esc(o[0])}</button>`).join("")}
 <div id="nx"></div></div>`}
function pick(k){
 const q=qs[i],b=document.querySelectorAll('.o');
 b.forEach((el,n)=>{el.disabled=true;if(q[1][n][1])el.classList.add('ok')});
 if(q[1][k][1])sc++;else b[k].classList.add('no');
 document.getElementById('nx').innerHTML=`<button class="p o" onclick="next()">${i+1===qs.length?"See results":"Next →"}</button>`}
function next(){i++;i<qs.length?show():end()}
function end(){
 const p=Math.round(sc/qs.length*100),m=p>=80?"Excellent work! 🎉":p>=50?"Good effort, keep practising! 👍":"Keep learning, you'll improve! 💪";
 app.innerHTML=`<div class="c"><h1>Results: ${name}</h1><div class="big">${sc} / ${qs.length}</div><p style="text-align:center">${p}% · ${m}</p>
 <div class="r"><button class="p" onclick="start(CATS.findIndex(c=>c[0]===name))">Retry</button><button onclick="home()">Menu</button></div></div>`}
home();
</script>
</body>
</html>
