<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numbers to One Million – 100 Question Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3fb;--card:#fff;--ink:#1d1550;--mut:#5d5890;--pk:#c2318f;--pkt:#fbe3f2;--ok:#17805a;--okt:#dcf5ea;--bad:#c0332a;--badt:#fde4e1;--ln:#d9d3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140f33;--card:#201a4a;--ink:#f0ecff;--mut:#aaa4d8;--pk:#ff6fc0;--pkt:#4a1f44;--ok:#4fd6a0;--okt:#173f35;--bad:#ff8379;--badt:#4a1f24;--ln:#3b3470}}
:root[data-theme="dark"]{--bg:#140f33;--card:#201a4a;--ink:#f0ecff;--mut:#aaa4d8;--pk:#ff6fc0;--pkt:#4a1f44;--ok:#4fd6a0;--okt:#173f35;--bad:#ff8379;--badt:#4a1f24;--ln:#3b3470}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.9rem,7vw,2.8rem);line-height:1.1;margin:8px 0 10px;font-weight:800;letter-spacing:-.02em}
p{margin:0 0 14px;color:var(--mut)}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:20px}
label{display:block;font-weight:600;margin:14px 0 6px}
select,button{font:inherit;color:inherit}
select{width:100%;padding:12px;border-radius:12px;border:2px solid var(--ln);background:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1;min-width:120px;padding:14px 18px;border-radius:14px;border:2px solid var(--pk);background:var(--pk);color:#fff;font-weight:800;cursor:pointer}
.btn.alt{background:transparent;color:var(--pk)}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#1d1550}
.btn:focus-visible,.opt:focus-visible,select:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--pk);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);gap:8px}
.tag{display:inline-block;background:var(--pkt);color:var(--pk);font-weight:600;font-size:.8rem;padding:3px 10px;border-radius:99px;margin:14px 0 4px}
.q{font-size:clamp(1.2rem,4.6vw,1.55rem);font-weight:600;margin:6px 0 16px;line-height:1.35;overflow-wrap:anywhere}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:14px;border:2px solid var(--ln);background:var(--card);font-size:1.05rem;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--pk)}
.opt.ok{border-color:var(--ok);background:var(--okt)}.opt.bad{border-color:var(--bad);background:var(--badt)}
.fb{font-weight:800;margin:6px 0 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.big{font-size:3.4rem;font-weight:800;line-height:1;color:var(--pk);margin:6px 0}
.rev{border-top:2px solid var(--ln);padding:12px 0;font-size:.95rem}.rev b{color:var(--ok)}.rev s{color:var(--bad)}
.top{display:flex;justify-content:flex-end}.th{background:none;border:2px solid var(--ln);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.85rem}
</style></head><body><main>
<div class="top"><button class="th" id="th" aria-label="Toggle dark mode">Dark / light</button></div>
<div id="app"></div></main>
<script>
// ---------- question generator (seeded so the 100 questions are fixed) ----------
let seed=20261002;const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),f=n=>n.toLocaleString('en-US'),pick=a=>a[ri(0,a.length-1)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const O=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],T=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function u(n){let s='';if(n>=100){s=O[n/100|0]+' hundred';n%=100;if(n)s+=' '}if(n>=20)s+=T[n/10|0]+(n%10?'-'+O[n%10]:'');else if(n)s+=O[n];return s}
const w=n=>n<1000?u(n):u(n/1000|0)+' thousand'+(n%1000?', '+u(n%1000):'');
const dd=k=>+sh([1,2,3,4,5,6,7,8,9]).slice(0,k).join('');
const NM=['ones','tens','hundreds','thousands','ten thousands','hundred thousands'];
function near(n){const s=String(n).split(''),r=[];for(let t=0;t<3;t++){const i=ri(0,s.length-2),c=s.slice();[c[i],c[i+1]]=[c[i+1],c[i]];r.push(+c.join(''))}
 for(let t=0;t<3;t++)r.push(n+pick([-1,1])*10**ri(1,Math.min(5,s.length-1)));return r}
function mk(cat,q,c,wr,fm=f){const cs=fm(c);let W=[...new Set(wr.map(fm))].filter(x=>x!==cs&&!x.startsWith('-')&&x!=='0'&&x!=='NaN');
 while(W.length<3&&fm===f){const x=c+pick([-1,1])*ri(1,9)*10**ri(1,4);const s=f(x);if(x>0&&s!==cs&&!W.includes(s))W.push(s)}
 W=sh(W).slice(0,3);const o=sh([cs,...W]);return{cat,q,o,a:o.indexOf(cs)}}
const S=String,id=x=>S(x);
const G=[
(i)=>{const n=dd(6),p=ri(0,5),d=+S(n)[5-p];return mk(0,`In ${f(n)}, what is the value of the digit ${d}?`,d*10**p,[0,1,2,3,4,5].filter(x=>x!==p).map(x=>d*10**x))},
(i)=>{const n=dd(6),p=ri(0,5),d=+S(n)[5-p];return i%2?mk(1,`In ${f(n)}, the digit ${d} stands for ${d} ___.`,NM[p],NM.filter((_,x)=>x!==p),id):mk(1,`In ${f(n)}, which digit is in the ${NM[p]} place?`,d,S(n).split('').map(Number).filter(x=>x!==d),id)},
(i)=>{const g=[ri(1,9),...Array.from({length:5},()=>ri(0,9))];g[ri(1,5)]=0;g[ri(1,5)]=0;const n=+g.join(''),t=[];g.forEach((d,k)=>{if(d)t.push(d*10**(5-k))});return mk(2,`What number is ${sh(t).map(f).join(' + ')}?`,n,near(n))},
(i)=>{let n=i%2?ri(10000,99999):ri(100000,999999);const s=S(n).split('');s[ri(1,s.length-1)]='0';n=+s.join('');return mk(3,`Which number is "${w(n)}"?`,n,near(n))},
(i)=>{let n=i%2?ri(10000,99999):ri(100000,999999);const s=S(n).split('');s[ri(1,s.length-1)]='0';n=+s.join('');return mk(4,`How do you write ${f(n)} in words?`,w(n),near(n).map(w),id)},
(i)=>{const st=[10,100,1000,10000,100000],s=pick(st),n=ri(150000,850000);
 if(i%3==2){const a=ri(100000,600000),k=pick(st);return mk(5,`Complete the pattern: ${f(a)}, ${f(a+k)}, ${f(a+2*k)}, ?`,a+3*k,[a+4*k,a+2*k,a+3*k+k*10,a+3*k-k*10,a+3*k+st[(st.indexOf(k)+1)%5]])}
 const d=i%2?1:-1;return mk(5,`What is ${f(s)} ${d>0?'more':'less'} than ${f(n)}?`,n+d*s,st.filter(x=>x!==s).map(x=>n+d*x))},
(i)=>{const b=ri(100,890)*1000,s=new Set;while(s.size<4)s.add(b+ri(1,999)*(rnd()<.7?1:0)+ri(0,9)*1000);const a=[...s],g=i%2==0;const c=g?Math.max(...a):Math.min(...a);return mk(6,`Which number is the ${g?'greatest':'least'}: ${a.map(f).join(', ')}?`,c,a.filter(x=>x!==c))},
(i)=>{const P=pick([100,1000,10000,100000]);let n;do{n=ri(100000,999999)}while(n%P==0);if(i%5==0)n=ri(1,Math.floor(900000/P))*P+P/2;
 const nm={100:'hundred',1000:'thousand',10000:'ten thousand',100000:'hundred thousand'};return mk(7,`Round ${f(n)} to the nearest ${nm[P]}.`,Math.round(n/P)*P,[Math.floor(n/P)*P,Math.ceil(n/P)*P,...[100,1000,10000,100000].filter(x=>x!==P).map(x=>Math.round(n/x)*x)])},
(i)=>{const U=pick([100,1000,10000]),t=i%4;let a,b,ans,q;do{if(t==0){a=ri(2,99);b=ri(2,99);ans=(a+b)*U;q=`${f(a*U)} + ${f(b*U)}`}
 else if(t==1){b=ri(2,60);a=b+ri(2,90);ans=(a-b)*U;q=`${f(a*U)} − ${f(b*U)}`}
 else if(t==2){a=ri(2,90);b=ri(2,9);ans=a*b*U;q=`${f(a*U)} × ${b}`}
 else{b=ri(2,9);const k=ri(2,90);a=b*k;ans=k*U;q=`${f(a*U)} ÷ ${b}`}}while(ans>=1e6||ans<=0);
 return mk(8,`${q} = ?`,ans,[ans*10,ans/10,ans+U,ans-U,ans+10*U,ans-10*U].filter(Number.isInteger))},
(i)=>{const t=i%3;if(t<2){const P=pick([100,1000,10000,100000]),X=ri(2,Math.floor(900000/P))*P,l=t==0;return mk(9,`What is the ${l?'least':'greatest'} whole number that rounds to ${f(X)} when rounded to the nearest ${({100:'hundred',1000:'thousand',10000:'ten thousand',100000:'hundred thousand'})[P]}?`,l?X-P/2:X+P/2-1,[X-P/2-1,X-P/2+1,X+P/2,X+P/2+1,X-P/2+(l?0:1)*0+P,X])}
 const ds=sh([1,2,3,4,5,6,7,8,9]).slice(0,6).sort(),ps=[];(function p(a,r){if(!r.length)return ps.push(+a.join(''));r.forEach((x,k)=>p([...a,x],r.filter((_,j)=>j!=k)))})([],ds);
 const ty=[['greatest',x=>1,0],['least',x=>1,0],['greatest even',x=>x%2==0,1],['greatest odd',x=>x%2==1,1],['least even',x=>x%2==0,0],['least odd',x=>x%2==1,0]];
 let r;do{const T=pick(ty.slice(2)),L=ps.filter(T[1]);if(!L.length)continue;const c=T[2]?Math.max(...L):Math.min(...L);r={T,c}}while(!r);
 const al=ty.map(T=>{const L=ps.filter(T[1]);return L.length?(T[2]?Math.max(...L):Math.min(...L)):0});
 return mk(9,`Use the digits ${ds.join(', ')} once each. What is the ${r.T[0]} 6-digit number you can make?`,r.c,[...al,...near(r.c)])}
];
const CATS=['Place value','Digit in a place','Expanded form','Words to numerals','Numerals to words','Counting and patterns','Comparing numbers','Rounding','Mental math','Challenge'];
const BANK=[];const seen=new Set;
for(let c=0;c<10;c++)for(let i=0;i<10;i++){let q,t=0;do{q=G[c](i+t);t++}while(seen.has(q.q)&&t<60);seen.add(q.q);BANK.push(q)}

// ---------- app ----------
const app=document.getElementById('app');let Q=[],ix=0,sc=0,miss=[],done=false;
const dk=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
document.getElementById('th').onclick=dk;
function home(){app.innerHTML=`<h1>Numbers to One Million</h1><p>${BANK.length} new questions on place value, expanded form, words, patterns, comparing, rounding and mental math (Dimensions Math 4A, Chapter 1).</p>
<div class="card"><label for="tp">Topic</label><select id="tp"><option value="-1">All topics (${BANK.length})</option>${CATS.map((c,k)=>`<option value="${k}">${c} (10)</option>`).join('')}</select>
<label for="ct">Number of questions</label><select id="ct"><option value="10">10 questions</option><option value="25">25 questions</option><option value="50">50 questions</option><option value="100">All available</option></select>
<div class="row"><button class="btn" id="go">Start quiz</button></div></div>`;
 document.getElementById('go').onclick=()=>{const t=+tp.value,n=+ct.value;let p=BANK.filter(q=>t<0||q.cat===t);Q=sh(p).slice(0,n);ix=0;sc=0;miss=[];quiz()}}
function quiz(){const q=Q[ix];app.innerHTML=`<div class="meta"><span>Question ${ix+1} of ${Q.length}</span><span>Score ${sc}</span></div><div class="bar"><i style="width:${ix/Q.length*100}%"></i></div>
<span class="tag">${CATS[q.cat]}</span><div class="q">${q.q}</div><div id="os">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div id="fb"></div><div class="row" id="nx"></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===q.a;app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('ok')});
  if(ok)sc++;else{b.classList.add('bad');miss.push({q:q.q,y:q.o[k],c:q.o[q.a]})}
  document.getElementById('fb').innerHTML=`<p class="fb ${ok?'ok':'bad'}">${ok?'Correct!':'Not quite. The answer is '+q.o[q.a]+'.'}</p>`;
  const nx=document.getElementById('nx');nx.innerHTML=`<button class="btn" id="n">${ix+1<Q.length?'Next question':'See my score'}</button>`;const n=document.getElementById('n');n.focus();n.onclick=()=>{ix++;ix<Q.length?quiz():end()}})}
function end(){const pc=Math.round(sc/Q.length*100);app.innerHTML=`<h1>${pc>=80?'Great work!':pc>=50?'Good effort!':'Keep practising!'}</h1><div class="card"><p>You scored</p><div class="big">${sc} / ${Q.length}</div><p>${pc}% correct</p>
<div class="row"><button class="btn" id="a">Try again</button><button class="btn alt" id="h">Change topic</button></div></div>
${miss.length?`<h2 style="margin-top:26px">Review your mistakes</h2><div class="card">${miss.map(m=>`<div class="rev">${m.q}<br>You chose <s>${m.y}</s> &nbsp; Correct: <b>${m.c}</b></div>`).join('')}</div>`:''}`;
 document.getElementById('a').onclick=()=>{Q=sh(Q);ix=0;sc=0;miss=[];quiz()};document.getElementById('h').onclick=home}
home();
</script></body></html>
