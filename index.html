<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synonyms & Antonyms Quiz – Grade 8</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mut:#667;--pri:#4a5fd8;--ok:#1f9d55;--bad:#d64545;--line:#dde2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141824;--card:#1e2435;--ink:#eef0f7;--mut:#9aa3bd;--line:#32395100;--line:#323951}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45}
.w{max-width:640px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.4rem;margin:.2em 0}.m{color:var(--mut);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);width:0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--pri);color:#fff}
.word{font-size:2rem;font-weight:800;margin:.3em 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:2px solid var(--pri);background:transparent;color:var(--ink);padding:7px 13px;border-radius:99px;font-size:1rem;cursor:pointer}
.chip.done{background:var(--pri);color:#fff}
.def{min-height:48px;border-left:4px solid var(--pri);padding:6px 12px;background:var(--bg);border-radius:6px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{padding:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:1.05rem;text-align:left;cursor:pointer}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt.ok{border-color:var(--ok);background:#1f9d5522}.opt.bad{border-color:var(--bad);background:#d6454522}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:1rem;cursor:pointer;margin-top:12px}
.fb{margin-top:10px;font-weight:600}
</style></head><body><div class="w" id="app"></div>
<script>
const RAW=`s|abundant|plentiful|scarce|tiny|hollow
s|brave|courageous|timid|gloomy|lazy
s|candid|honest|secretive|clumsy|wealthy
s|diligent|hardworking|careless|jealous|ancient
s|enormous|gigantic|miniature|fragile|quiet
s|fatigue|exhaustion|energy|hunger|delight
s|generous|charitable|greedy|stubborn|nervous
s|hesitate|pause|rush|shout|gather
s|ignorant|uninformed|wise|polite|cheerful
s|jovial|cheerful|grumpy|tired|rigid
s|keen|eager|reluctant|rough|distant
s|loyal|faithful|fickle|rude|shy
s|meager|scanty|ample|noisy|bright
s|obstinate|stubborn|flexible|gentle|frantic
s|peculiar|strange|familiar|ordinary|tidy
s|rapid|swift|sluggish|steady|heavy
s|serene|calm|stormy|anxious|harsh
s|tranquil|peaceful|turbulent|rowdy|bitter
s|vivid|vibrant|dull|pale|vague
s|weary|tired|refreshed|thrilled|curious
s|conceal|hide|reveal|display|announce
s|commence|begin|finish|delay|cancel
s|fragile|delicate|sturdy|massive|solid
s|gloomy|dismal|radiant|jolly|brisk
s|ponder|contemplate|ignore|forget|dismiss
a|ancient|modern|primitive|antique|historic
a|victory|defeat|triumph|success|conquest
a|expand|contract|enlarge|stretch|grow
a|generous|stingy|giving|kind|charitable
a|optimist|pessimist|dreamer|believer|leader
a|transparent|opaque|clear|see-through|glassy
a|permanent|temporary|lasting|eternal|fixed
a|accept|reject|receive|welcome|take
a|arrive|depart|reach|land|enter
a|attract|repel|draw|pull|tempt
a|barren|fertile|empty|dry|desolate
a|courage|cowardice|bravery|valor|boldness
a|distant|near|far|remote|faraway
a|humble|arrogant|modest|meek|gentle
a|inferior|superior|lesser|poorer|minor
a|mature|immature|grown|ripe|adult
a|prohibit|allow|forbid|ban|block
a|rural|urban|rustic|farm|village
a|scarce|plentiful|rare|limited|sparse
a|vague|clear|hazy|murky|blurred
a|increase|decrease|grow|rise|boost
a|shallow|deep|flat|thin|narrow
a|sincere|deceitful|truthful|earnest|genuine
a|strict|lenient|firm|harsh|severe
a|wise|foolish|clever|sage|smart`;
const D={abundant:"existing in large amounts",scarce:"hard to find; in short supply",plentiful:"more than enough",tiny:"very small",hollow:"empty inside",brave:"ready to face danger",courageous:"showing bravery",timid:"shy and fearful",gloomy:"dark and sad",lazy:"unwilling to work",candid:"open and honest",honest:"truthful",secretive:"keeping things hidden",clumsy:"awkward in movement",wealthy:"very rich",diligent:"careful and hardworking",hardworking:"putting in great effort",careless:"not paying attention",jealous:"envious of others",ancient:"very old",enormous:"extremely large",gigantic:"huge",miniature:"a very small version",fragile:"easily broken",quiet:"making little noise",fatigue:"extreme tiredness",exhaustion:"complete tiredness",energy:"strength to be active",hunger:"need for food",delight:"great joy",generous:"willing to give freely",charitable:"kind and giving to those in need",greedy:"wanting too much",stubborn:"refusing to change one's mind",nervous:"worried or uneasy",hesitate:"to pause before acting",pause:"a short stop",rush:"move in great haste",shout:"yell loudly",gather:"bring together",ignorant:"lacking knowledge",uninformed:"not having information",wise:"having good judgement",polite:"well-mannered",cheerful:"happy and bright",jovial:"jolly and good-humoured",grumpy:"bad-tempered",tired:"needing rest",rigid:"stiff; not bending",keen:"very interested",eager:"wanting to do something",reluctant:"unwilling",rough:"not smooth",distant:"far away",loyal:"faithful to a person or cause",faithful:"steadfast; true",fickle:"changing often",rude:"impolite",shy:"nervous around others",meager:"small in amount",scanty:"barely enough",ample:"more than enough",noisy:"loud",bright:"giving much light",obstinate:"stubbornly refusing to change",flexible:"able to bend or adapt",gentle:"soft and kind",frantic:"wild with worry",peculiar:"odd or unusual",strange:"unusual",familiar:"well known",ordinary:"normal",tidy:"neat",rapid:"very fast",swift:"quick",sluggish:"slow-moving",steady:"constant",heavy:"weighing a lot",serene:"calm and peaceful",calm:"not disturbed",stormy:"wild and violent",anxious:"worried",harsh:"cruel or severe",tranquil:"free from disturbance",peaceful:"quiet and calm",turbulent:"wild and disorderly",rowdy:"noisy and disorderly",bitter:"sharp and unpleasant in taste",vivid:"strong and bright",vibrant:"full of life and colour",dull:"not interesting or bright",pale:"light in colour",vague:"unclear",weary:"very tired",refreshed:"made fresh again",thrilled:"very excited",curious:"eager to know",conceal:"to hide",hide:"put out of sight",reveal:"make known",display:"show",announce:"tell publicly",commence:"to begin",begin:"start",finish:"complete",delay:"make late",cancel:"call off",delicate:"easily damaged",sturdy:"strong and solid",massive:"very large and heavy",solid:"firm and hard",dismal:"gloomy and depressing",radiant:"shining brightly",jolly:"happy and cheerful",brisk:"quick and lively",ponder:"to think carefully",contemplate:"think deeply",ignore:"pay no attention to",forget:"fail to remember",dismiss:"send away",modern:"of the present time",primitive:"very early; simple",antique:"very old object",historic:"important in history",victory:"winning",defeat:"a loss",triumph:"a great win",success:"achieving a goal",conquest:"taking by force",expand:"to grow larger",contract:"to shrink",enlarge:"make bigger",stretch:"make longer",grow:"become bigger",stingy:"unwilling to spend or give",giving:"handing over freely",kind:"caring and friendly",optimist:"one who expects good outcomes",pessimist:"one who expects the worst",dreamer:"one who imagines",believer:"one who has faith",leader:"one who guides",transparent:"able to be seen through",opaque:"not letting light through",clear:"easy to see or understand","see-through":"transparent",glassy:"smooth and shiny like glass",permanent:"lasting forever",temporary:"lasting a short time",lasting:"continuing",eternal:"without end",fixed:"set firmly",accept:"to receive willingly",reject:"to refuse",receive:"to get",welcome:"greet gladly",take:"grasp or get",arrive:"to reach a place",depart:"to leave",reach:"get to",land:"come down",enter:"go in",attract:"to pull towards",repel:"to push away",draw:"pull",pull:"move towards oneself",tempt:"entice",barren:"unable to produce plants",fertile:"rich and productive",empty:"containing nothing",dry:"without moisture",desolate:"lonely and bare",courage:"bravery",cowardice:"lack of courage",bravery:"courage",valor:"great courage",boldness:"daring",near:"close",far:"a long way off",remote:"far from everything",faraway:"at a great distance",humble:"not proud",arrogant:"overly proud",modest:"not boastful",meek:"quiet and gentle",inferior:"lower in quality",superior:"higher in quality",lesser:"smaller in importance",poorer:"lower in quality",minor:"small in importance",mature:"fully grown",immature:"not fully developed",grown:"fully developed",ripe:"ready to eat",adult:"fully grown person",prohibit:"to forbid",allow:"permit",forbid:"order not to do",ban:"officially forbid",block:"obstruct",rural:"of the countryside",urban:"of the city",rustic:"country-style",farm:"land for crops",village:"small settlement",rare:"not often found",limited:"restricted",sparse:"thinly spread",hazy:"not clear",unclear:"not easy to understand",murky:"dark and cloudy",blurred:"smudged; not sharp",increase:"to grow",decrease:"to become less",rise:"go up",boost:"lift or raise",shallow:"not deep",deep:"far down",flat:"level",thin:"not thick",narrow:"small in width",sincere:"genuine",deceitful:"dishonest",truthful:"telling the truth",earnest:"serious and sincere",genuine:"real",strict:"demanding obedience",lenient:"not strict",firm:"not soft",severe:"very strict or harsh",foolish:"lacking sense",clever:"quick to learn",sage:"a wise person",smart:"intelligent"};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const Q=sh(RAW.split("\n").map(l=>{const p=l.split("|");return{t:p[0],w:p[1],c:p[2],o:sh(p.slice(2))}}));
let i=0,score=0,seen,ans,wrong=[],cur="";
const app=document.getElementById("app");
function start(){i=0;score=0;wrong=[];app.innerHTML=`<div class="c"><h1>Synonyms &amp; Antonyms Quiz</h1><p>50 questions · Grade 8</p><p><b>Rule:</b> before you can answer, look up the question word <b>and every option</b> in the dictionary. Tap each word to read its meaning, then choose your answer.</p><button class="btn" onclick="show()">Start quiz</button></div>`}
function show(){const q=Q[i];seen=new Set();ans=false;cur="";const ws=[q.w,...q.o];
app.innerHTML=`<div class="c"><div class="m">Question ${i+1} of 50 · Score ${score}</div><div class="bar"><i style="width:${i*2}%"></i></div></div>
<div class="c"><span class="tag">${q.t=="s"?"SYNONYM (same meaning)":"ANTONYM (opposite meaning)"}</span><div class="word">${q.w}</div>
<div class="m">📖 Dictionary check: <b id="cnt">0</b>/5 words looked up</div>
<div class="chips">${ws.map(w=>`<button class="chip" data-w="${w}" onclick="look(this)">${w}</button>`).join("")}</div>
<div class="def" id="def">Tap a word above to see its meaning.</div>
<div class="opts">${q.o.map(o=>`<button class="opt" disabled data-o="${o}" onclick="pick(this)">${o}</button>`).join("")}</div>
<div class="fb" id="fb"></div></div>`}
function look(b){const w=b.dataset.w;b.classList.add("done");seen.add(w);document.getElementById("def").innerHTML=`<b>${w}</b>: ${D[w]||"—"}`;document.getElementById("cnt").textContent=seen.size;
if(seen.size==5&&!ans){document.querySelectorAll(".opt").forEach(o=>o.disabled=false);document.getElementById("fb").textContent="✅ All words checked. Now choose your answer."}}
function pick(b){if(ans)return;ans=true;const q=Q[i],ok=b.dataset.o==q.c;
document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.dataset.o==q.c)o.classList.add("ok")});
if(ok)score++;else{b.classList.add("bad");wrong.push(q)}
document.getElementById("fb").innerHTML=(ok?"🎉 Correct!":"❌ Not quite. Correct answer: <b>"+q.c+"</b>")+`<br><button class="btn" onclick="next()">${i==49?"See results":"Next →"}</button>`}
function next(){i++;i<50?show():end()}
function end(){const p=Math.round(score*2);app.innerHTML=`<div class="c"><h1>Quiz complete!</h1><p class="word">${score} / 50 (${p}%)</p><p>${p>=80?"Excellent work! 🌟":p>=60?"Good effort — review the ones below.":"Keep practising — use the dictionary and try again."}</p>
${wrong.length?`<h3>Review</h3>`+wrong.map(q=>`<p><b>${q.w}</b> (${q.t=="s"?"synonym":"antonym"}) → <b>${q.c}</b> <span class="m">– ${D[q.c]}</span></p>`).join(""):""}
<button class="btn" onclick="location.reload()">Try again</button></div>`}
start();
</script></body></html>
