<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fraction Worksheet Solver</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf6;--grid:#dbe6f2;--ink:#23272e;--mute:#66707c;--pencil:#c8372d;--card:#fff;--line:#c9d3de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b21;--grid:#222a35;--ink:#e8ebef;--mute:#98a2ae;--pencil:#ff7b6e;--card:#1e242c;--line:#36404c}}
:root[data-theme="dark"]{--bg:#171b21;--grid:#222a35;--ink:#e8ebef;--mute:#98a2ae;--pencil:#ff7b6e;--card:#1e242c;--line:#36404c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:Lexend,system-ui,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-family:Kalam,cursive;font-size:clamp(2rem,7vw,3.2rem);line-height:1.1;margin:0 0 6px}
h1 span{color:var(--pencil)}
p.lead{color:var(--mute);margin:0 0 24px;max-width:56ch}
.card{background:var(--card);border:2px solid var(--ink);border-radius:4px 14px 4px 14px;padding:16px;margin-bottom:14px}
.solver{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mute);gap:4px}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px}
input{width:120px}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
button.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;cursor:pointer}
.err{color:var(--pencil);margin:8px 0 0;min-height:1.4em;font-size:.9rem}
details{background:var(--card);border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px}
details[open]{border-color:var(--ink)}
summary{cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:12px;list-style:none;font-size:1.05rem;flex-wrap:wrap}
summary::-webkit-details-marker{display:none}
.n{font-weight:600;color:var(--mute);min-width:1.6em}
.ans{margin-left:auto;font-family:Kalam,cursive;font-weight:700;color:var(--pencil);font-size:1.25rem;display:flex;align-items:center;gap:6px}
.steps{padding:0 14px 14px 14px}
.step{padding:10px 0;border-top:1px dashed var(--line)}
.step small{display:block;color:var(--mute);font-size:.8rem;margin-bottom:2px}
.expr{font-size:1.15rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.f{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;vertical-align:middle;margin:0 2px}
.f i{font-style:normal;padding:0 4px}.f i:first-child{border-bottom:1.5px solid currentColor}
.w{font-size:1.15em;margin-right:1px}
.hand{font-family:Kalam,cursive;color:var(--pencil);font-weight:700}
h2{font-family:Kalam,cursive;margin:28px 0 10px;font-size:1.6rem}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools button{cursor:pointer;font-size:.85rem;padding:6px 12px}
@media(prefers-reduced-motion:no-preference){.step{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style></head>
<body><main>
<h1>Multiplying &amp; dividing <span>fractions</span></h1>
<p class="lead">Set I from your worksheet, solved with every step shown. Tap a problem to open it, or type your own below.</p>

<div class="card">
<div class="solver">
<label>First number<input id="a" value="1 7/8" aria-label="First fraction or mixed number"></label>
<label>Operation<select id="op"><option value="*">× multiply</option><option value="/">÷ divide</option></select></label>
<label>Second number<input id="b" value="5/6" aria-label="Second fraction or mixed number"></label>
<button class="go" id="go">Solve</button>
</div>
<p class="err" id="err" role="alert"></p>
<div id="custom"></div>
<p style="color:var(--mute);font-size:.8rem;margin:8px 0 0">Type mixed numbers with a space (1 7/8), fractions as 5/6, whole numbers as 12.</p>
</div>

<h2>Set I</h2>
<div class="tools"><button id="openAll">Open all</button><button id="closeAll">Close all</button></div>
<div id="list"></div>
</main>
<script>
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const F=(n,d)=>`<span class="f"><i>${n}</i><i>${d}</i></span>`;
const mixedH=(w,n,d)=>n===0?`<span class="w">${w}</span>`:(w?`<span class="w">${w}</span>`:'')+F(n,d);
function parse(s){
  s=s.trim();let m;
  if(m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/)){const[w,n,d]=[+m[1],+m[2],+m[3]];if(!d)return null;return{w,n,d,N:w*d+n,D:d,mixed:true}}
  if(m=s.match(/^(\d+)\/(\d+)$/)){const[n,d]=[+m[1],+m[2]];if(!d)return null;return{N:n,D:d}}
  if(m=s.match(/^(\d+)$/))return{N:+m[1],D:1};
  return null}
const show=p=>p.mixed?mixedH(p.w,p.n,p.d):(p.D===1?`<span class="w">${p.N}</span>`:F(p.N,p.D));
function solve(A,B,op){
  const S=[];const add=(t,h)=>S.push([t,h]);
  add('Start',`<div class="expr">${show(A)} <b>${op==='*'?'×':'÷'}</b> ${show(B)}</div>`);
  if(A.mixed||B.mixed){
    let h='<div class="expr">';
    h+=A.mixed?`${show(A)} = ${F(A.w+' × '+A.D+' + '+A.n,A.D)} = ${F(A.N,A.D)}`:show(A);
    h+=' &nbsp;|&nbsp; ';
    h+=B.mixed?`${show(B)} = ${F(B.w+' × '+B.D+' + '+B.n,B.D)} = ${F(B.N,B.D)}`:show(B);
    add('Turn mixed numbers into improper fractions',h+'</div>');
  }
  let N1=A.N,D1=A.D,N2=B.N,D2=B.D;
  if(op==='/'){
    add('Divide = multiply by the reciprocal (flip the second fraction)',`<div class="expr">${F(N1,D1)} × ${F(D2,N2)}</div>`);
    [N2,D2]=[D2,N2];
  }
  const N=N1*N2,D=D1*D2;
  add('Multiply across',`<div class="expr">${F(N1+' × '+N2,D1+' × '+D2)} = ${F(N,D)}</div>`);
  const g=gcd(N,D),sn=N/g,sd=D/g;
  if(g>1)add('Simplify (divide top and bottom by '+g+')',`<div class="expr">${F(N+' ÷ '+g,D+' ÷ '+g)} = ${F(sn,sd)}</div>`);
  else add('Simplify','<div class="expr">Already in simplest form.</div>');
  let final;
  if(sd===1)final=`<span class="w">${sn}</span>`;
  else if(sn>sd){const w=Math.floor(sn/sd),r=sn%sd;
    add('Convert to a mixed number',`<div class="expr">${sn} ÷ ${sd} = ${w} remainder ${r} → ${mixedH(w,r,sd)}</div>`);
    final=r?mixedH(w,r,sd):`<span class="w">${w}</span>`}
  else final=F(sn,sd);
  return{S,final,improper:sd!==1&&sn>sd?F(sn,sd):null}}
const render=(r)=>r.S.map(([t,h])=>`<div class="step"><small>${t}</small>${h}</div>`).join('')+`<div class="step"><small>Answer</small><div class="expr hand" style="font-size:1.5rem">${r.final}</div></div>`;
const probs=[['1 7/8','*','5/6'],['2 1/3','*','5/16'],['1 1/6','*','12 1/3'],['13/15','*','2 2/5'],['2/9','*','2 9/10'],['7/22','/','1/6'],['21/32','/','3/5'],['3 1/2','/','25/34'],['7 2/3','/','4/7'],['2 4/15','/','2 2/5']];
const order=[1,3,5,7,9,2,4,6,8,10]; // worksheet reads in columns; list in number order instead
const list=document.getElementById('list');
probs.forEach(([a,op,b],i)=>{
  const A=parse(a),B=parse(b),r=solve(A,B,op);
  const d=document.createElement('details');
  d.innerHTML=`<summary><span class="n">${i+1}</span>${show(A)}<b>${op==='*'?'×':'÷'}</b>${show(B)}<span class="ans">= ${r.final}</span></summary><div class="steps">${render(r)}</div>`;
  list.appendChild(d)});
const $=id=>document.getElementById(id);
$('openAll').onclick=()=>list.querySelectorAll('details').forEach(d=>d.open=true);
$('closeAll').onclick=()=>list.querySelectorAll('details').forEach(d=>d.open=false);
function custom(){
  const A=parse($('a').value),B=parse($('b').value),op=$('op').value;
  if(!A||!B){$('err').textContent='Check the format: use 1 7/8, 5/6, or 12. Denominators can\u2019t be 0.';$('custom').innerHTML='';return}
  if(op==='/'&&B.N===0){$('err').textContent='You can\u2019t divide by zero.';$('custom').innerHTML='';return}
  $('err').textContent='';$('custom').innerHTML='<div class="steps" style="padding:0">'+render(solve(A,B,op))+'</div>'}
$('go').onclick=custom;
['a','b'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')custom()}));
custom();
</script></body></html>
