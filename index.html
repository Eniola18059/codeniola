<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zion's Number Bond Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#FFB627; --coral:#FF6F59; --sky:#4EA8DE; --leaf:#5FAD56;
    --bg:#FFF8EC; --card:#FFFFFF; --ink:#3A3226; --muted:#8A7F6C;
    --line: rgba(58,50,38,0.12); --ok:#4C9A5A; --bad:#E0564A;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top: env(safe-area-inset-top,0px);}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    display:flex; justify-content:center; padding:28px 16px 48px;
  }
  .wrap{width:100%; max-width:520px;}
  header{text-align:center; margin-bottom:18px;}
  .kicker{font-size:14px; font-weight:800; color:var(--coral); letter-spacing:.03em; text-transform:uppercase;}
  h1{
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(28px,7vw,36px);
    margin:4px 0 6px; color:var(--ink);
  }
  .sub{color:var(--muted); font-size:14.5px; max-width:38ch; margin:0 auto;}

  .progress-row{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); font-weight:800; margin-top:20px;}
  .track{position:relative; height:12px; background:var(--line); border-radius:8px; margin:6px 0 4px; overflow:hidden;}
  .track-fill{height:100%; background:linear-gradient(90deg,var(--sun),var(--coral)); width:0%; transition:width .4s ease; border-radius:8px;}

  .card{
    background:var(--card); border-radius:22px; padding:26px 22px 24px; margin-top:18px;
    box-shadow:0 10px 30px rgba(58,50,38,0.08); border:1px solid var(--line);
  }
  .tag{display:inline-block; font-size:12.5px; font-weight:800; color:#fff; background:var(--sky); padding:5px 12px; border-radius:20px; margin-bottom:14px;}
  .question{font-family:'Fredoka',sans-serif; font-size:20px; text-align:center; margin:0 0 14px; color:var(--ink);}

  .bond-svg{display:block; margin:0 auto 18px;}
  .bond-circle{fill:var(--card); stroke-width:4;}
  .bond-text{font-family:'Fredoka',sans-serif; font-weight:600; font-size:30px; fill:var(--ink); text-anchor:middle; dominant-baseline:central;}
  .bond-line{stroke-width:4; stroke-linecap:round;}

  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .opt{
    font-family:'Fredoka',sans-serif; font-size:22px; font-weight:600; color:var(--ink);
    background:var(--bg); border:2px solid var(--line); border-radius:16px; padding:16px 10px;
    cursor:pointer; transition:transform .12s, border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--sky); transform:translateY(-2px);}
  .opt:focus-visible{outline:3px solid var(--sky); outline-offset:2px;}
  .opt.correct{background:rgba(76,154,90,0.15); border-color:var(--ok); color:#2E6B3A;}
  .opt.wrong{background:rgba(224,86,74,0.12); border-color:var(--bad); color:var(--bad);}
  .opt:disabled{cursor:default; transform:none;}

  .feedback{min-height:24px; margin-top:16px; font-weight:800; font-size:15px; text-align:center;}
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--bad);}

  .next{
    display:block; margin:16px auto 0; font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; color:#fff;
    background:var(--coral); border:none; border-radius:14px; padding:13px 26px;
    cursor:pointer; visibility:hidden;
  }
  .next:hover{background:#E85440;}
  .next:focus-visible{outline:3px solid var(--sky); outline-offset:2px;}

  .end{text-align:center;}
  .end h2{font-family:'Fredoka',sans-serif; font-size:28px; color:var(--ink); margin:0 0 6px;}
  .score-big{font-size:50px; font-weight:700; font-family:'Fredoka',sans-serif; color:var(--coral);}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241F1A; --card:#2E2822; --ink:#F3ECDF; --muted:#B9AE98; --line: rgba(243,236,223,0.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#241F1A; --card:#2E2822; --ink:#F3ECDF; --muted:#B9AE98; --line: rgba(243,236,223,0.14);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Zion's math practice</div>
    <h1>Number Bond Garden 🌻</h1>
    <div class="sub">100 friendly number bonds to grow — bonds to 5, 10, 20, missing wholes, and doubles.</div>
  </header>

  <div class="progress-row"><span id="pos">Question 1 of 100</span><span id="scoreLabel">Score: 0</span></div>
  <div class="track"><div class="track-fill" id="fill"></div></div>

  <div class="card" id="card"></div>
</div>

<script>
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function uniqueDistractors(correct,gen,count,minV,maxV){
  const set=new Set([correct]);
  let tries=0;
  while(set.size<count+1 && tries<60){
    let v=gen();
    if(v>=minV && v<=maxV) set.add(v);
    tries++;
  }
  while(set.size<count+1){ set.add(ri(minV,maxV)); }
  return [...set];
}

// bond = {whole, a, b, missing: 'whole'|'a'|'b', tag}
function makeBond(whole,a,b,missing,tag){
  const answer = missing==='whole'?whole: missing==='a'?a:b;
  const maxV = Math.max(whole,20);
  const opts = shuffle(uniqueDistractors(answer, ()=>answer+ri(-4,4), 3, 0, maxV).map(String));
  return {whole,a,b,missing,tag,answer:String(answer),options:opts};
}

function bondsTo(total){
  const a=ri(0,total); const b=total-a;
  const missing = Math.random()<0.5 ? 'a' : 'b';
  return makeBond(total,a,b,missing,`Bonds to ${total}`);
}
function missingWhole(){
  const a=ri(0,10), b=ri(0,10);
  return makeBond(a+b,a,b,'whole','Find the whole');
}
function doublesBond(){
  const n=ri(1,10);
  const missing = Math.random()<0.5 ? 'whole' : (Math.random()<0.5?'a':'b');
  return makeBond(2*n,n,n,missing,'Doubles');
}

function genQuestion(i){
  const mod=i%5;
  if(mod===0) return bondsTo(5);
  if(mod===1) return bondsTo(10);
  if(mod===2) return bondsTo(20);
  if(mod===3) return missingWhole();
  return doublesBond();
}
function buildQuestions(total){
  const out=[];
  for(let i=0;i<total;i++) out.push(genQuestion(i));
  return out;
}

const TOTAL=100;
let questions=buildQuestions(TOTAL);
let current=0, score=0, answered=false;

const card=document.getElementById('card');
const fill=document.getElementById('fill');
const pos=document.getElementById('pos');
const scoreLabel=document.getElementById('scoreLabel');

function bondSVG(q){
  const wVal = q.missing==='whole' ? '?' : q.whole;
  const aVal = q.missing==='a' ? '?' : q.a;
  const bVal = q.missing==='b' ? '?' : q.b;
  const missColor = 'var(--coral)';
  const normColor = 'var(--ink)';
  return `
  <svg class="bond-svg" width="260" height="180" viewBox="0 0 260 180">
    <line x1="130" y1="55" x2="65" y2="125" class="bond-line" stroke="#4EA8DE"/>
    <line x1="130" y1="55" x2="195" y2="125" class="bond-line" stroke="#5FAD56"/>
    <circle cx="130" cy="45" r="38" class="bond-circle" stroke="#4EA8DE"/>
    <text x="130" y="47" class="bond-text" fill="${q.missing==='whole'?missColor:normColor}">${wVal}</text>
    <circle cx="55" cy="135" r="34" class="bond-circle" stroke="#5FAD56"/>
    <text x="55" y="137" class="bond-text" fill="${q.missing==='a'?missColor:normColor}">${aVal}</text>
    <circle cx="205" cy="135" r="34" class="bond-circle" stroke="#FFB627"/>
    <text x="205" y="137" class="bond-text" fill="${q.missing==='b'?missColor:normColor}">${bVal}</text>
  </svg>`;
}

function render(){
  fill.style.width=(current/TOTAL*100)+'%';
  pos.textContent=`Question ${Math.min(current+1,TOTAL)} of ${TOTAL}`;
  scoreLabel.textContent=`Score: ${score}`;

  if(current>=TOTAL){
    card.innerHTML=`
      <div class="end">
        <h2>You grew the whole garden, Zion! 🌼</h2>
        <div class="score-big">${score} / ${TOTAL}</div>
        <p class="sub" style="margin:8px auto 0;">${score>=90?"Amazing! You really know your number bonds.":score>=70?"Great growing! A bit more practice and you'll have them all.":"Nice try! Replant the garden to practice more."}</p>
        <button class="next" style="visibility:visible" onclick="restart()">Plant it again</button>
      </div>`;
    return;
  }

  const q=questions[current];
  answered=false;
  card.innerHTML=`
    <span class="tag">${q.tag}</span>
    <p class="question">What number is missing?</p>
    ${bondSVG(q)}
    <div class="options" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <button class="next" id="nextBtn" onclick="nextQ()">Next</button>
  `;
  const optsEl=document.getElementById('opts');
  q.options.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=()=>select(b,opt,q.answer);
    optsEl.appendChild(b);
  });
}

function select(btn,chosen,correctAns){
  if(answered) return;
  answered=true;
  const fb=document.getElementById('fb');
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correctAns) b.classList.add('correct');
  });
  if(chosen===correctAns){
    score++;
    fb.textContent='Yes! Great job! 🌟';
    fb.className='feedback ok';
  } else {
    btn.classList.add('wrong');
    fb.textContent=`So close — it's ${correctAns}.`;
    fb.className='feedback bad';
  }
  document.getElementById('nextBtn').style.visibility='visible';
  scoreLabel.textContent=`Score: ${score}`;
}

function nextQ(){ current++; render(); }
function restart(){ questions=buildQuestions(TOTAL); current=0; score=0; render(); }

render();
</script>
</body>
</html>
